# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint scripts
        run: |
          pip install ruff
          ruff check scripts
      - name: Install CV tooling
        # wkhtmltopdf 0.12.4 (patched Qt) renders the CV PDF; see scripts/install_roboto_cv.py
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-roboto fontconfig libxrender1 libxext6 libfontconfig1 xfonts-base xfonts-75dpi
          wget -q https://github.com/wkhtmltopdf/wkhtmltopdf/releases/download/0.12.4/wkhtmltox-0.12.4_linux-generic-amd64.tar.xz
          tar xf wkhtmltox-0.12.4_linux-generic-amd64.tar.xz
          sudo mv wkhtmltox/bin/wkhtmlto* /usr/bin/
          pip install -r requirements.txt
          python scripts/install_roboto_cv.py
      - name: Build site
        run: |
          pip install -r requirements.txt
          python scripts/build.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
