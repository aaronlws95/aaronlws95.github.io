<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The above meta tags must come first in the head; any other head content must come after these tags -->
  <meta name="description" content="{{description}}">
  <meta name="author" content="Aaron Low">
  <link rel="canonical" href="{{url}}">
  <!-- Open Graph / link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Aaron Low">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{image}}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="imgs/avatarsmall.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="imgs/avatarsmall.ico" type="image/x-icon" />
  <link rel="stylesheet" href="{{stylesheet}}" type="text/css" />
  <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">
  <title>{{title}}</title>
</head>
<body>
{{body}}
</body>
</html>
